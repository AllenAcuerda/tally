<ion-app>
  <ion-router-outlet></ion-router-outlet>

  @if (showNavigation) {
    <div class="bottom-nav-container">
      <ion-tab-bar class="custom-tab-bar">
        
        <ion-tab-button tab="home" [routerLink]="['/home']" routerLinkActive="tab-selected" [routerLinkActiveOptions]="{ exact: true }">
          <ion-icon name="home-outline"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="wallet" [routerLink]="['/wallet']" routerLinkActive="tab-selected">
          <ion-icon name="wallet-outline"></ion-icon>
          <ion-label>Wallet</ion-label>
        </ion-tab-button>

        <div class="fab-spacer"></div>

        <ion-tab-button tab="bills" [routerLink]="['/bills']" routerLinkActive="tab-selected">
          <ion-icon name="receipt-outline"></ion-icon>
          <ion-label>Bills</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="settings" [routerLink]="['/settings']" routerLinkActive="tab-selected">
          <ion-icon name="settings-outline"></ion-icon>
          <ion-label>Settings</ion-label>
        </ion-tab-button>

      </ion-tab-bar>
    </div>

    <ion-fab vertical="bottom" horizontal="center" slot="fixed" class="center-fab">
      <ion-fab-button (click)="openAddEntryModal()">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  }
</ion-app>
